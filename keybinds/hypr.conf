$mainMod = super # Sets "Windows" key as main modifier

# Applications
bind = $mainMod, T, exec, $terminal
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, M, exec, $menu
bind = $mainMod, B, exec, $browser
bind = $mainMod, N, exec, $text

# Stuff
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, V, togglefloating,
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, R, exec, systemctl reboot
bind = $mainMod, S, exec, swaync-client -t
bind = $mainMod, O, exec, ~/.dotfiles/hypr/scripts/clock-overlay.sh
bindr = $mainMod, O, exec, ~/.dotfiles/hypr/scripts/close-clock-overlay.sh
bind = $mainMod, Z, exec, ~/.useful_stuff/script_launcher.sh
# bind = $mainMod, S, exec, systemctl poweroff

bind = , PRINT, exec, hyprshot -m output

# Move focus with mainMod + nvim keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, ampersand, workspace, 1
bind = $mainMod, bracketleft, workspace, 2
bind = $mainMod, braceleft, workspace, 3
bind = $mainMod, braceright, workspace, 4
bind = $mainMod, parenleft, workspace, 5
bind = $mainMod, equal, workspace, 6
bind = $mainMod, asterisk, workspace, 7
bind = $mainMod, parenright, workspace, 8
bind = $mainMod, plus, workspace, 9
bind = $mainMod, bracketright, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, ampersand, movetoworkspace, 1
bind = $mainMod SHIFT, bracketleft, movetoworkspace, 2
bind = $mainMod SHIFT, braceleft, movetoworkspace, 3
bind = $mainMod SHIFT, braceright, movetoworkspace, 4
bind = $mainMod SHIFT, parenleft, movetoworkspace, 5
bind = $mainMod SHIFT, equal, movetoworkspace, 6
bind = $mainMod SHIFT, asterink, movetoworkspace, 7
bind = $mainMod SHIFT, parenright, movetoworkspace, 8
bind = $mainMod SHIFT, plus, movetoworkspace, 9
bind = $mainMod SHIFT, bracketright, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, W, togglespecialworkspace, magic
bind = $mainMod SHIFT, W, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, ~/.useful_stuff/brighter.sh
bindel = ,XF86MonBrightnessDown, exec, ~/.useful_stuff/darker.sh

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

